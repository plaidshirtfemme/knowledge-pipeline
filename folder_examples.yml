# Примеры для обучения Claude правильной классификации.
# Формат:
#   folder_key:
#     YES:
#       - "описание контента который ТОЧНО идёт в эту папку"
#     NOT:
#       - "описание контента который НЕ идёт сюда → folder_key"

inbox:
  YES:
    - "общекультурный контент без прямой связи с профессией дизайнера"
    - "хобби, аниме, музыка, личные интересы"
  NOT:
    - "шрифты → typography"
    - "hh.ru, платформа с вакансиями, работодатель, вакансии, рынок труда, зарплата → career"
    - "Nano banana, Open AI, Perplexity → others_AI"
    - "референс → references"
    - "яркие цвета, красивые цвета → colors"
    - "Authentication, Developer → development"
    - "UX/UI, Emotional Design → ux_ui_design"
    - "здания, стили архитектуры, окружающая среда → architecture"
    - "когнитивные искажения, поведение людей → psychology"

organize_my_workday:
  YES:
    - "личная продуктивность, тайм-менеджмент, как организовать рабочий день"
    - "как учиться самостоятельно, системы обучения, построение привычек"
    - "методы планирования: GTD, Pomodoro, time-blocking"
  NOT:
    - "командные процессы, agile, scrum → team_workflows"
    - "карьерный рост, резюме → career"

product_management:
  YES:
    - "роадмап продукта, приоритизация фич, работа с беклогом"
    - "метрики продукта, OKR, product strategy"
  NOT:
    - "сравнение нейросетей, ai → others_AI"

product_design:
  YES:
    - "product design, продуктовый дизайн, дизайн-процесс"
  NOT:
    - "продуктовая команда → team_workflows"
    - "сравнение нейросетей, ai → others_AI"

design_system:
  YES:
    - "design system, дизайн-система, компоненты, автолейауты"
  NOT:
    - "выбор планшета → tablet_for_design"
    - "афиши, постеры, разбор киноафиш → print_design"
    - "курс по иллюстрации, основы светотени, блик, свет, полутон → colors"
    - "UI/UX design, коммуникация → ux_ui_design"
    - "продуктовая команда → team_workflows"
    - "сравнение нейросетей, ai → others_AI"

graphic_design:
  YES:
    - "графический дизайн в целом: если тема не попадает точно в одну из подпапок"
    - "иллюстрация, композиция, визуальное мышление дизайнера"
    - "разбор чужих работ без привязки к конкретной теме"
    - "техники рисования, скетчинг"
    - "разбор культовых промышленных изделий с точки зрения дизайна"
  NOT:
    - "дизайн интерфейсов приложений → ux_ui_design"
    - "брендинг и фирменный стиль → brand_design"
    - "анимация и моушн → motion_design"
    - "обложки YouTube → beautiful_youtube_covers"
    - "типографика → typography"
    - "цвет → colors"
    - "печатный дизайн → print_design"
    - "мокапы → mockups"

beautiful_youtube_covers:
  YES:
    - "как сделать обложку для YouTube, thumbnail design, превью для видео"
    - "психология кликабельных обложек, что делает превью привлекательным"
    - "инструменты и шаблоны для YouTube thumbnail"
  NOT:
    - "общий графический дизайн без привязки к YouTube → graphic_design"

references:
  YES:
    - "где искать референсы, подборки визуала для вдохновения"
    - "как собирать мудборды, организовывать референсы"
    - "подборки дизайн-работ, визуальные тренды как источник референсов"
    - "примеры, списки, подборки рекомендуемых сайтов, дизайнеров"
    - "тренды в дизайне, что актуально, обзоры дизайн-направлений"
    - "вдохновение, откуда брать идеи"
  NOT:
    - "туториал по конкретному инструменту → соответствующая папка инструмента"

mockups:
  YES:
    - "как создавать мокапы, где брать готовые мокапы"
    - "презентация дизайна на мокапах устройств, упаковки, печати"
    - "смарт-объекты в Photoshop для мокапов"
  NOT:
    - "прототип интерфейса (кликабельный) → product_design"

typography:
  YES:
    - "выбор шрифтов, типографские приёмы, леттеринг"
    - "пейринг шрифтов, типографская иерархия, кернинг"
    - "каллиграфия, ручной леттеринг, кириллические шрифты"
  NOT:
    - "типографика как один из элементов дизайн-системы → design_system"

colors:
  YES:
    - "теория цвета, цветовые палитры, колористика"
    - "как подбирать цвета для проекта, цветовые сочетания"
    - "психология цвета, цветовые тренды"
    - "курс по иллюстрации в части света, теней, тона, рефлексов"
  NOT:
    - "цвет как часть дизайн-системы или брендинга → design_system или brand_design"

print_design:
  YES:
    - "дизайн постеров, афиш, флаеров, открыток"
    - "упаковка, этикетки, полиграфия"
    - "вёрстка для печати, дизайн журналов и книг"
    - "разбор киноафиш, анализ композиции постеров"
  NOT:
    - "технические требования к печати, допечатная подготовка → prepress"

prepress:
  YES:
    - "допечатная подготовка: CMYK, цветопроба, растрирование"
    - "технические требования типографий, настройка файлов для печати"
    - "работа с цветовыми профилями ICC, конвертация RGB в CMYK"
  NOT:
    - "дизайн для печати (творческая часть) → print_design"

motion_design:
  YES:
    - "анимация интерфейсов, motion в UI"
    - "видеографика, transitions, After Effects туториалы"
    - "моушн-дизайн как профессия и процесс"
  NOT:
    - "творческий процесс поиска вдохновения (без привязки к моушну) → references"
    - "система для хранения идей и референсов → organize_my_workday"

career:
  YES:
    - "как составить резюме дизайнера, что писать в резюме"
    - "грейды дизайнеров: junior/middle/senior, как расти"
    - "опыт работы за рубежом, релокация, поиск работы"
    - "зарплаты дизайнеров, рынок труда, hh.ru, вакансии"
    - "офисная культура, останется без работы (тема карьеры)"
  NOT:
    - "как учиться самостоятельно, системы обучения → organize_my_workday"
    - "как пройти конкретное собеседование → interview_prep"

portfolio:
  YES:
    - "как собрать портфолио дизайнера: структура, кейсы, подача"
    - "разбор чужого портфолио: что хорошо, что плохо"
    - "советы по оформлению кейса в Behance или на личном сайте"
  NOT:
    - "интервью с дизайнером о его карьерном пути → talks_with_designers"
    - "как найти клиентов на фрилансе → freelance"
    - "как пройти собеседование, тестовое задание → interview_prep"
    - "туториал по Tilda где дизайнер показывает свою работу → tilda"

talks_with_designers:
  YES:
    - "интервью с дизайнером, подкаст с дизайнером о профессии"
    - "разговор о карьерном пути, опыте, взглядах конкретного дизайнера"
    - "личный опыт дизайнера: как пришёл в профессию, чему научился"
  NOT:
    - "обучающий урок по Figma → figma"
    - "советы по поиску работы → career"

psychology:
  YES:
    - "когнитивные искажения, поведение людей, психология восприятия"
    - "мотивация, эмоции, психология принятия решений"
    - "психология пользователя в контексте UX (если фокус на психологии, а не дизайне)"
  NOT:
    - "UX-исследования с фокусом на дизайне → ux_research"
    - "психология цвета → colors"

architecture:
  YES:
    - "архитектура зданий, стили архитектуры (модернизм, баухаус и т.д.)"
    - "городская среда, пространство, окружающая среда"
    - "интерьеры, ландшафтный дизайн"
    - "музеи, выставочные пространства как архитектура"
  NOT:
    - "системная архитектура ПО, tech architecture → tech_leading"
    - "урбанистика как транспорт и инфраструктура → inbox"
